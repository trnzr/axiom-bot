name:
Smart Wallet Tracker
on:
schedule:
- cron: '0 */4 ***' workflow_dispatch:
jobs:
run-tracker:
runs-on: ubuntu-latest steps:
- name: Checkout code
uses: actions/checkout@v3
- name: Setup Python
uses: actions/setup-python@v4 with:
python-version: '3.10'
- name: Install dependencies run: pip install requests
- name: Run Tracker env:
DISCORD_WEBHOOK_URL: $
{{ secrets.DISCORD_WEBHOOK_URL 3}
HELIUS_API_KEY: $
{< secrets. HELIUS_API_KEY 3} run: python tracker. py
