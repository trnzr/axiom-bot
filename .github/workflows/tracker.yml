name :
Smart Wallet Tracker
on :
schedule:
- cron:
'0 */4 * * *' # Relance
toutes les 4 heures
workflow_dispatch:
# Bouton pour
lancer manuellement
jobs:
run-tracker:
runs-on: ubuntu-latest steps:
- name: Récupérer le code uses: actions/checkout@v3
- name: Installer Python uses: actions/setup-python@v4
with:
python-version: '3.10'
- name: Installer les dépendances run: pip install requests
- name: Lancer le Tracker
env:
DISCORD_WEBHOOK_URL: $
{{ secrets.DISCORD_WEBHOOK_URL 3}
HELIUS_API_KEY: $
{{ secrets. HELIUS_API_KEY 3}
run: python tracker. py
