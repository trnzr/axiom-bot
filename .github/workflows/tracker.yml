name: Smart Wallet Tracker
on:
schedule :
- cron: '0 */4 * * *' # Relance
toutes les 4 heures
workflow_dispatch:
# Ajoute un
bouton pour le lancer manuellement
jobs:
run-tracker:
runs-on: ubuntu-latest steps :
- name: Récupérer le code uses: actions/checkout@v3
- name: Installer Python uses: actions/setup-python@v4
with:
python-version: '3.10'
- name: Installer les dépendances run: pip install requests
- name: Lancer le Tracker
env:
HELIUS_API_KEY: $
{{ secrets.HELIUS_API_KEY }}
TELEGRAM_TOKEN: $
{{ secrets. TELEGRAM_TOKEN 3}
TELEGRAM_CHAT_ID: $
{{ secrets. TELEGRAM_CHAT_ID 3}
run: python tracker.py
